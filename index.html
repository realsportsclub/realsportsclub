/* =========================================================
SPORTS CLUB
DISEÑO PRINCIPAL
========================================================= */

:root{
--black:#050505;
--black2:#0b0b0d;
--black3:#111116;

--gold:#f5bd28;
--gold2:#ffd966;
--gold-dark:#8d6410;

--red:#d71920;

--purple:#8d168d;

--white:#ffffff;

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--black);
color:#fff;
font-family:
Inter,
Arial,
Helvetica,
sans-serif;
overflow-x:hidden;
}

a{
text-decoration:none;
color:inherit;
}

img{
max-width:100%;
display:block;
}

button{
font-family:inherit;
}


/* =========================================================
SCROLLBAR
========================================================= */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#050505;
}

::-webkit-scrollbar-thumb{
background:linear-gradient(
var(--red),
var(--gold)
);
border-radius:20px;
}


/* =========================================================
HEADER
========================================================= */

.header{
position:fixed;
z-index:9999;
top:0;
left:0;
width:100%;
height:82px;

background:
linear-gradient(
90deg,
rgba(0,0,0,.96),

border-bottom:
1px solid rgba(245,189,40,.18);
}

.nav{
width:min(1250px,92%);
height:100%;

display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.brand-logo{
width:47px;
height:57px;

object-fit:contain;

filter:
drop-shadow(0 0 10px rgba(245,189,40,.25));
}

.brand-text{
font-size:20px;
font-weight:1000;
letter-spacing:1px;
text-transform:uppercase;
}

.brand-text span{
color:var(--gold);
}

.menu{
display:flex;
align-items:center;
gap:27px;
list-style:none;
}

.menu a{
color:#d6d6d6;
font-size:12px;
font-weight:800;
text-transform:uppercase;
letter-spacing:.8px;

color:var(--gold);
}

.menu-button{

background:none;

/* =========================================================
HERO
========================================================= */

.hero{

position:relative;

display:flex;
align-items:center;

overflow:hidden;

background:
radial-gradient(
circle at 82% 48%,
rgba(142,22,141,.28),
transparent 28%
),

radial-gradient(
circle at 78% 65%,
rgba(215,25,32,.16),
transparent 32%
),

#030303;
}

.hero::before{
content:"";

position:absolute;
inset:0;

background:
linear-gradient(
90deg,
#030303 0%,
rgba(3,3,3,.96) 28%,
rgba(3,3,3,.62) 55%,
rgba(3,3,3,.18) 100%

z-index:1;
}

.hero::after{
content:"";

position:absolute;

width:650px;
height:650px;

right:-220px;
top:100px;

border-radius:50%;

1px solid rgba(245,189,40,.12);

0 0 80px rgba(245,189,40,.06);

z-index:1;
}

.hero-main{
position:absolute;

width:min(580px,52vw);

right:6%;
top:50%;

transform:
translateY(-50%);

z-index:2;

object-fit:contain;

filter:
drop-shadow(0 20px 40px rgba(0,0,0,.9))
drop-shadow(0 0 25px rgba(245,189,40,.13));

animation:
eagleFloat 6s ease-in-out infinite;
}

@keyframes eagleFloat{

0%,100%{
transform:
translateY(-50%)
scale(1);
}

50%{
transform:
translateY(calc(-50% - 10px))
scale(1.015);
}
}

.hero-content{
width:min(1250px,92%);
margin:auto;

position:relative;
z-index:4;

padding-top:82px;
}

.eyebrow{
display:inline-flex;
align-items:center;
gap:9px;

color:var(--gold2);

font-size:11px;
font-weight:900;

text-transform:uppercase;
letter-spacing:3px;

margin-bottom:22px;
}

.eyebrow::before{

width:35px;
height:2px;

linear-gradient(
90deg,

}

102px

letter-spacing:-5px;

text-transform:uppercase;
}

.hero h1 .white{

}

.hero h1 .red{
color:var(--red);
}

.hero h1 .gold{

}

.hero-description{

color:#aaa;

font-size:17px;

line-height:1.75;

margin-top:30px;
}

.hero-actions{
display:flex;
flex-wrap:wrap;
gap:12px;

margin-top:32px;
}

.btn{
display:inline-flex;

align-items:center;
justify-content:center;

min-height:50px;

padding:
0 24px;

border-radius:3px;

font-weight:1000;

text-transform:uppercase;

letter-spacing:1px;

transform .25s,

.btn-red{

135deg,
var(--red),
#a80e14

0 10px 30px rgba(215,25,32,.22);
}

.btn-gold{

background:
linear-gradient(
135deg,
var(--gold2),
var(--gold)

box-shadow:
0 10px 30px rgba(245,189,40,.17);

.btn-outline{

1px solid rgba(255,255,255,.23);

background:
rgba(255,255,255,.03);

color:#fff;
}

.btn-outline:hover{

color:var(--gold);
}

.scroll{
position:absolute;

bottom:28px;
left:50%;

transform:translateX(-50%);

z-index:4;

color:#686868;

font-size:9px;
font-weight:800;

letter-spacing:3px;

text-transform:uppercase;

SECTION GENERAL
========================================================= */

content:"";

position:absolute;

height:70px;

bottom:-25px;

border-radius:50%;

saturate(.9)

}

.team:hover img{

.team-overlay{

inset:0;

justify-content:flex-end;

linear-gradient(

text-transform:uppercase;

letter-spacing:2px;
}

.team h3{
font-size:28px;

text-transform:uppercase;

margin-top:7px;
}


/* =========================================================
MATCHES
========================================================= */

.matches{
background:#050505;
}

.match-list{
display:grid;
gap:10px;
}

.match{
display:grid;

grid-template-columns:
160px
1fr
160px;

align-items:center;

padding:
20px 25px;

background:
linear-gradient(
90deg,
#111,
#151113
);

border:
1px solid rgba(255,255,255,.07);

transition:.25s;
}

.match:hover{

rgba(245,189,40,.4);
}

.match-date{

font-size:10px;

font-weight:900;

text-transform:uppercase;

.match-teams{

font-weight:1000;

font-size:16px;
}

.match-teams span{
color:var(--red);

margin:
0 16px;

.match-location{

text-align:right;

font-size:10px;

/* =========================================================

========================================================= */

.news{

circle at 90% 30%,

grid-template-columns:
repeat(3,1fr);

}

.news-card{
background:#111;

border:
1px solid rgba(255,255,255,.08);

overflow:hidden;
}

.news-image{
height:225px;

overflow:hidden;
}

.news-image img{
width:100%;
height:100%;

object-fit:cover;

transition:.5s;
}

.news-card:hover img{
transform:scale(1.07);
}

.news-body{
padding:23px;
}

.news-category{
color:var(--gold);

font-size:9px;

font-weight:900;

letter-spacing:2px;

text-transform:uppercase;
}

.news-body h3{

line-height:1.15;

margin:
10px 0;
}

.news-body p{
color:#777;

font-size:13px;
}


/* =========================================================
RESULTS
========================================================= */

.results{
background:
linear-gradient(
135deg,
#080808,
#13070b
);
}

.results-grid{
display:grid;

grid-template-columns:
1fr 1fr;

gap:20px;
}

.result-card{

background:#111;

border:
1px solid rgba(255,255,255,.08);
}

.result-card h3{

font-size:11px;

text-transform:uppercase;

letter-spacing:2px;

margin-bottom:25px;
}

.score{

align-items:center;
justify-content:center;

text-align:center;
}

.score-team{

font-weight:900;

}

.score-number{

font-weight:1000;
}

.score-number.gold{
color:var(--gold);
}

.vs{
color:#555;

font-weight:900;
}


/* =========================================================
TABLE
========================================================= */

.table{
width:100%;

border-collapse:collapse;
}

.table th{
color:#666;

font-size:9px;

text-transform:uppercase;

letter-spacing:1px;

border-bottom:
1px solid #292929;
}

.table td{
padding:12px 9px;

border-bottom:
1px solid #202020;

font-size:12px;
}

.table td:last-child,
.table th:last-child{
text-align:right;
}

.table .position{
color:var(--gold);

font-weight:1000;
}

width:min(1250px,92%);

margin:
0 auto 105px;
}

.digital-content h2{
font-size:
clamp(
38px,
5vw,

22px 0 30px;

.sponsor-grid{

grid-template-columns:
